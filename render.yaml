services:
  - type: web
    name: automated-invoice-recognition
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: AMOUNT_TOLERANCE
        value: 1.0
      - key: TAX_TOLERANCE
        value: 1.0
      - key: PRICE_TOLERANCE
        value: 0.01
