services:
  - type: web
    name: automated-invoice-recognition
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: AMOUNT_TOLERANCE
        value: 1.0
      - key: TAX_TOLERANCE
        value: 1.0
      - key: PRICE_TOLERANCE
        value: 0.01
